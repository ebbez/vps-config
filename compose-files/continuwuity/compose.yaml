services:
  server:
    image: forgejo.ellis.link/continuwuation/continuwuity:main
    container_name: continuwuity_server
    restart: unless-stopped
    expose:
      - '8008'
    networks:
      - reverse_proxy
    environment:
      CONTINUWUITY_SERVER_NAME: ${CONTINUWUITY_DOMAIN}
      CONTINUWUITY_ADDRESS: '0.0.0.0'
      CONTINUWUITY_ALLOW_REGISTRATION: true
      CONTINUWUITY_REGISTRATION_TOKEN: ${CONTINUWUITY_REGISTRATION_TOKEN}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ROCKSDB_REPAIR: true
      CONTINUWUITY_OAUTH__OIDC__PROVIDER_NAME: Zitadel SSO
      CONTINUWUITY_OAUTH__OIDC__DISCOVERY_URL: ${CONTINUWUITY_OAUTH__OIDC__DISCOVERY_URL}
      CONTINUWUITY_OAUTH__OIDC__CLIENT_ID: ${CONTINUWUITY_OAUTH__OIDC__CLIENT_ID}
      CONTINUWUITY_OAUTH__OIDC__CLIENT_SECRET: ${CONTINUWUITY_OAUTH__OIDC__CLIENT_SECRET}
      CONTINUWUITY_OAUTH__OIDC__ADDITIONAL_TRUSTED_AUDIENCES: ${CONTINUWUITY_OAUTH__OIDC__ADDITIONAL_TRUSTED_AUDIENCES}
    volumes:
      - ./data:/var/lib/continuwuity/
    
networks:
  reverse_proxy:
    external: true

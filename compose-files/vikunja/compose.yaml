services:
  vikunja:
    image: vikunja/vikunja:2.3.0
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_URL}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_AUTH_OPENID_ENABLED: true
      VIKUNJA_AUTH_OPENID_PROVIDERS_ZITADEL_NAME: Zitadel
      VIKUNJA_AUTH_OPENID_PROVIDERS_ZITADEL_AUTHURL: ${VIKUNJA_AUTHURL}
      VIKUNJA_AUTH_OPENID_PROVIDERS_ZITADEL_CLIENTID: ${VIKUNJA_CLIENTID} 
      VIKUNJA_AUTH_OPENID_PROVIDERS_ZITADEL_CLIENTSECRET: ${VIKUNJA_CLIENTSECRET}
      VIKUNJA_AUTH_OPENID_PROVIDERS_ZITADEL_SCOPE: "openid profile email"
    volumes:
      - ./filesdata:/app/vikunja/files
      - ./dbdata:/db
    networks:
      - reverse_proxy
    restart: unless-stopped

networks:
  reverse_proxy:
    external: true
